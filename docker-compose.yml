version: '3.8'

services:
  mixsource:
    image: mixsource:latest
    container_name: socky-mixsource
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - ./mcp:/app/mcp
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - socky-network

networks:
  socky-network:
    driver: bridge
